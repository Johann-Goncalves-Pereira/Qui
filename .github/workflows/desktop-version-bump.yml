name: Desktop Version Bump

# Canonical bump while Actions budget is $0:
#   ./scripts/desktop-version-bump-local  (see docs/desktop/versioning.md)
# Keep this workflow as manual-only so it cannot double-bump if Actions returns.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    name: Bump desktop patch version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.15.0'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: bump
        run: |
          OLD_VER=$(node -p "require('./desktop/package.json').version")
          node desktop/scripts/bump-version.mjs
          NEW_VER=$(node -p "require('./desktop/package.json').version")
          echo "old_ver=$OLD_VER" >> "$GITHUB_OUTPUT"
          echo "new_ver=$NEW_VER" >> "$GITHUB_OUTPUT"

      - name: Commit and push tag
        run: |
          git add desktop/package.json
          git commit -m "chore(desktop): bump version to ${{ steps.bump.outputs.new_ver }} [skip ci]"
          git tag "v${{ steps.bump.outputs.new_ver }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.bump.outputs.new_ver }}"
