<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qui</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="glass-body">
  <div class="drag-region"></div>
  <div class="glass-container">
    <div class="glass-card">
      <div class="brand-header">
        <div class="logo-container">
          <img src="logo.png" alt="Qui Logo" class="brand-logo" />
        </div>
        <h1 class="brand-title">Qui</h1>
        <p class="brand-subtitle">Desktop Command Center</p>
      </div>

      <div class="status-section">
        <div class="status-row">
          <span class="status-label">Qui Service</span>
          <span id="qui-status" class="status-badge checking">Starting...</span>
        </div>
        <div class="status-row">
          <span class="status-label">qBittorrent Daemon</span>
          <span id="qbit-status" class="status-badge checking">Starting...</span>
        </div>
      </div>

      <form id="login-form" class="login-form">
        <div class="input-group">
          <label for="username-input" class="input-label">Username</label>
          <input id="username-input" type="text" class="glass-input" placeholder="admin" autocomplete="username" required />
        </div>
        <div class="input-group">
          <label for="password-input" class="input-label">Password</label>
          <input id="password-input" type="password" class="glass-input" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button id="sign-in-btn" type="submit" class="glass-btn primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Sign In">
            <title>Sign In</title>
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
          </svg>
          Sign In
        </button>
      </form>

      <div class="auth-divider">
        <span>or</span>
      </div>

      <div id="auth-section" class="auth-section">
        <button id="touch-id-btn" type="button" class="glass-btn secondary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" role="img" aria-label="Fingerprint Icon">
            <title>Fingerprint Icon</title>
            <path d="M12 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zM12 14c-2.33 0-7 1.17-7 3.5V19h14v-1.5c0-2.33-4.67-3.5-7-3.5z"/>
          </svg>
          Unlock with Touch ID
        </button>
        <p id="auth-feedback" class="auth-feedback"></p>
      </div>

      <div id="update-modal" class="update-modal hidden">
        <div class="modal-backdrop"></div>
        <div class="modal-card">
          <h2 class="modal-title">Docker Update Available</h2>
          <p id="update-desc" class="modal-desc">A newer Docker image is available for Qui / qBittorrent. Would you like to update now?</p>
          <div class="modal-actions">
            <button id="update-now-btn" type="button" class="glass-btn primary">Update Now</button>
            <button id="update-later-btn" type="button" class="glass-btn secondary">Later</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
